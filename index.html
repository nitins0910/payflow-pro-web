<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayFlow Pro · Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="ledger-bg"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-card__strip"></div>
    <div class="auth-card__body">

      <div class="brand">
        <span class="mark">PF</span>
        <h1>PayFlow Pro</h1>
      </div>
      <p class="tagline">// corporate payroll engine</p>

      <div id="errorBox" class="error-msg"></div>

      <!-- LOGIN FORM -->
      <form id="loginForm">
        <div class="field">
          <label>Email</label>
          <input type="email" id="loginEmail" required autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="hidden">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="signupName" required autocomplete="name">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="signupEmail" required autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="signupPassword" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" id="signupBtn">Create Account</button>
      </form>

      <div class="divider">OR</div>

      <button id="googleBtn" class="btn btn-google">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.7 0-14.3 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-2.1 14.1-5.6l-6.5-5.5C29.5 34.7 26.9 35.5 24 35.5c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.6 39.5 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.4-2.4 4.4-4.4 5.8l6.5 5.5C40.5 36.5 44 30.8 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Continue with Google
      </button>

      <div class="switch-mode">
        <span id="switchToSignupWrap">New here? <button type="button" id="switchToSignup">Create an account</button></span>
        <span id="switchToLoginWrap" class="hidden">Already have an account? <button type="button" id="switchToLogin">Sign in</button></span>
      </div>

    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
