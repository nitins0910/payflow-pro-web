<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayFlow Pro · Verify Email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="ledger-bg"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-card__strip"></div>
    <div class="auth-card__body" style="text-align:center;">

      <div class="brand" style="justify-content:center;">
        <span class="mark">PF</span>
        <h1>PayFlow Pro</h1>
      </div>

      <div id="statusIcon" style="font-size:40px; margin:24px 0 10px;">⏳</div>
      <p id="statusText" style="color:var(--text2); font-size:14px; line-height:1.6; margin-bottom:24px;">
        Verifying your email...
      </p>

      <button id="continueBtn" class="btn btn-primary hidden">Continue to Login</button>

    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/verify-email.js"></script>
</body>
</html>
